[package]
name = "inference-engine"
version = "0.1.0"
edition = "2021"
description = "A Rust inference engine for user-owned devices"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
fancy-regex = "0.14.0"
half = "2.7.1"
hex = "0.4.3"
rcgen = "0.14.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", default-features = false, features = ["sync"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
uuid = { version = "1.26.1", features = ["v4"] }
x509-parser = { version = "0.18.1", features = ["verify"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"

[dev-dependencies]
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
tower = { version = "0.5.3", features = ["util"] }
