[package]
name = "inference-engine"
version = "0.1.0"
edition = "2021"
description = "A Rust inference engine for user-owned devices"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
half = "2.7.1"
fancy-regex = "0.14.0"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", default-features = false, features = ["sync"] }
uuid = { version = "1.26.1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"

[dev-dependencies]
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
tower = { version = "0.5.3", features = ["util"] }
