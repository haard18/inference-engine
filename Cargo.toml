[package]
name = "inference-engine"
version = "0.1.0"
edition = "2021"
description = "A Rust inference engine for user-owned devices"

[dependencies]
half = "2.7.1"
fancy-regex = "0.14.0"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
